services:
  dsp-voice-lab:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dsp-voice-lab-service
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./backend/storage:/app/backend/storage
      - ./backend/models:/app/backend/models
    restart: unless-stopped
